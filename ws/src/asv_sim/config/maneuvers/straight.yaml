# Maneuver "straight" (M1.7a): east along y = 0 through both Task 1 gates,
# open loop. Row k holds from times[k] until times[k + 1] (zero-order hold);
# the last row marks the end and must be all zero (then zero thrust until
# Ctrl-C). Meaning of the columns: mix() (include/asv_sim/mix.hpp).
# Values [EST], checked on the 3-DOF model (test/test_maneuver_files.cpp).
maneuver_player:
  ros__parameters:
    control_rate: 20.0   # Hz
    start_delay: 3.0     # s after the first /clock message (as the follower)
    times:    [0.0, 25.0]   # s since the start (tau)
    throttle: [0.1, 0.0]    # fraction of max_thrust; 0.1 = 2 x 5 N -> about 1 m/s (Step 1)
    steer:    [0.0, 0.0]    # rad, > 0 turns left
    spin:     [0.0, 0.0]    # fraction of max_thrust, > 0 turns left
